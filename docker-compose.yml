version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gas-mobil-mysql
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: gas_mobil
      MYSQL_USER: gas_mobil_user
      MYSQL_PASSWORD: gas_mobil_pass_2024
    volumes:
      - mysql_data:/var/lib/mysql
      # REMOVED: ./apps/api/database/init.sql mount (file does not exist in repo)
    networks:
      - gas-mobil-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "gas_mobil_user", "-pgas_mobil_pass_2024"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: gas-mobil-api
    ports:
      - '5000:5000'
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: gas_mobil_user
      DB_PASSWORD: gas_mobil_pass_2024
      DB_NAME: gas_mobil
      DB_DATABASE: gas_mobil
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_change_in_production}
      REFRESH_SECRET: ${REFRESH_SECRET:-your_refresh_secret_key_change_in_production}
      JWT_EXPIRES_IN: 15m
      REFRESH_EXPIRES_IN: 7d
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      CLIENT_URL: http://localhost:3000
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/.env:/app/.env:ro
    networks:
      - gas-mobil-network
    command: npm run dev
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gas-mobil-redis
    ports:
      - '6379:6379'
    networks:
      - gas-mobil-network

volumes:
  mysql_data:

networks:
  gas-mobil-network:
    driver: bridge
