server {
    listen 80;
    server_name _;

    # Customer-facing public website
    location / {
        root /usr/share/nginx/html/public;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Administrator dashboard
    location = /admin {
        return 301 /admin/;
    }
    location ^~ /admin/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # Station agent portal
    location = /agent {
        return 301 /agent/;
    }
    location ^~ /agent/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /agent/index.html;
    }

    # Do not allow directory listings or expose dotfiles.
    location ~ /\\. {
        deny all;
    }
}
