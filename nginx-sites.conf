# Public customer website
server {
    listen 80;
    server_name gas-mobil.com www.gas-mobil.com;
    root /usr/share/nginx/html/public;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Administrator dashboard
server {
    listen 80;
    server_name admin.gas-mobil.com;
    root /usr/share/nginx/html/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpe?g|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}

# Station agent portal
server {
    listen 80;
    server_name agent.gas-mobil.com;
    root /usr/share/nginx/html/agent;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpe?g|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}

# Safe fallback if the host header is unexpected
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html/public;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
