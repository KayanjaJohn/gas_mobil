<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#061D16">
  <meta name="robots" content="noindex,nofollow">
  <title>Reset Password | GasMobil Uganda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#061d16;background-image:url('/gasmobil-cylinder-exact.png'),url('/gasmobil-blue-cylinder.svg');background-position:center;background-size:cover;background-attachment:fixed;color:#fff8ee;font-family:'DM Sans',sans-serif}
    body:before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(2,18,13,.94),rgba(2,18,13,.74) 55%,rgba(2,18,13,.28))}
    main{position:relative;width:min(100%,440px);padding:34px;border:1px solid #ffffff35;border-radius:22px;background:#041b13d9;backdrop-filter:blur(18px);box-shadow:0 24px 80px #0008}
    .logo{display:block;width:76px;height:76px;object-fit:contain;margin:0 auto 10px}h1{text-align:center;margin:6px 0;font-size:28px}h1 span{color:#f36a21}.sub{text-align:center;color:#ccdad2;margin:0 0 26px}
    label{display:block;margin:16px 0 7px;color:#d4e0d9;font-size:14px}input{width:100%;padding:14px;border:1px solid #ffffff45;border-radius:10px;background:#061910;color:#fff;font-size:16px;outline:none}input:focus{border-color:#f36a21}
    .field{position:relative}.toggle{position:absolute;right:8px;top:7px;padding:7px 10px;border:0;background:transparent;color:#ffc08f;cursor:pointer}
    button.submit{width:100%;margin-top:22px;padding:15px;border:0;border-radius:10px;background:linear-gradient(90deg,#f36a21,#ff7b16);color:#fff;font-weight:800;font-size:16px;cursor:pointer}
    #status{margin-top:16px;text-align:center;line-height:1.5;color:#c8d8cf}a{color:#ffc08f;text-decoration:none}
  </style>
</head>
<body>
<main>
  <img class="logo" src="/gasmobil-icon.png" alt="GasMobil Uganda">
  <h1>Choose a new <span>password</span></h1>
  <p class="sub">Secure your GasMobil account</p>
  <form id="resetForm">
    <label for="password">New password</label>
    <div class="field"><input id="password" type="password" minlength="8" autocomplete="new-password" required><button class="toggle" type="button" data-toggle="password">Show</button></div>
    <label for="confirm">Confirm new password</label>
    <div class="field"><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button class="toggle" type="button" data-toggle="confirm">Show</button></div>
    <button class="submit" id="submit" type="submit">Update password</button>
  </form>
  <p id="status" role="status"></p>
  <p style="text-align:center;margin-bottom:0"><a href="/">Back to GasMobil</a></p>
</main>
<script>
const token=new URLSearchParams(location.search).get("token");
const statusNode=document.getElementById("status");
document.querySelectorAll("[data-toggle]").forEach(button=>button.addEventListener("click",()=>{
  const input=document.getElementById(button.dataset.toggle);
  input.type=input.type==="password"?"text":"password";
  button.textContent=input.type==="password"?"Show":"Hide";
}));
document.getElementById("resetForm").addEventListener("submit",async event=>{
  event.preventDefault();
  const password=document.getElementById("password").value;
  const confirm=document.getElementById("confirm").value;
  if(!token){statusNode.textContent="This reset link is missing its token. Request a new reset email.";return;}
  if(password.length<8){statusNode.textContent="Use at least 8 characters.";return;}
  if(password!==confirm){statusNode.textContent="The passwords do not match.";return;}
  const button=document.getElementById("submit");
  button.disabled=true;button.textContent="Updating...";
  try{
    const response=await fetch("https://api.gas-mobil.com/api/auth/reset-password",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token,password})
    });
    const data=await response.json();
    if(!response.ok||!data.success)throw new Error(data.error||"Unable to reset password.");
    statusNode.textContent="Password updated successfully. You can now sign in to GasMobil.";
    document.getElementById("resetForm").remove();
  }catch(error){statusNode.textContent=error.message||"Unable to reset password. Request a new link.";}
  finally{button.disabled=false;button.textContent="Update password";}
});
</script>
</body>
</html>
