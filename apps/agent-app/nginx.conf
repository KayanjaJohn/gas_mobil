server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: serve the SPA entry point for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache fingerprinted frontend assets.
    location ~* \.(?:css|js|mjs|svg|png|jpe?g|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
