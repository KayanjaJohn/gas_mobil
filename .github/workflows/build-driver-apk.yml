name: Build GasMobil Driver APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-driver-apk:
    name: Build Driver APK with EAS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/driver-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/driver-app/package-lock.json

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Start and wait for Android APK build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN. Add it in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          eas build --platform android --profile production-apk --non-interactive --wait
