name: Build Driver Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-driver-apk:
    name: Build Driver APK with EAS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Trigger and wait for EAS APK build
        working-directory: apps/driver-app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add EXPO_TOKEN in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx --yes eas-cli@latest build --profile production-apk --platform android --non-interactive --wait
