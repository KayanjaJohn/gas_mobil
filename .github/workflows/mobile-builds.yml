name: Build GasMobil Android APKs

on:
  workflow_dispatch:
    inputs:
      app:
        description: Which Android app to build
        required: true
        type: choice
        options:
          - customer
          - driver
          - both
        default: both

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ inputs.app == 'both' && fromJSON('["customer","driver"]') || fromJSON(format('["{0}"]', inputs.app)) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Android APK with EAS
        working-directory: ${{ matrix.app == 'customer' && 'apps/mobile' || 'apps/driver-app' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add EAS_TOKEN in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx --yes eas-cli@latest build --profile production-apk --platform android --non-interactive --wait
